services:
  - type: web
    name: hydrosentinel-ai
    env: python
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RENDER_KEEP_ALIVE
        value: "true"
      - key: RENDER_PING_INTERVAL_SEC
        value: "660"


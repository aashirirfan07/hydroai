<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Isometric 3D Mountain Prism Wireframe -->
  <polygon points="32,8 56,22 56,46 32,60 8,46 8,22" stroke="url(#g2)" stroke-width="2" fill="rgba(6,12,28,0.7)"/>
  <line x1="32" y1="8" x2="32" y2="60" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.8"/>
  <line x1="8" y1="22" x2="32" y2="36" stroke="#00f0ff" stroke-width="1.5"/>
  <line x1="56" y1="22" x2="32" y2="36" stroke="#00f0ff" stroke-width="1.5"/>
  <!-- Mountain Peaks Inside Prism -->
  <polygon points="32,20 44,38 20,38" fill="url(#g2)" opacity="0.85" filter="url(#glow2)"/>
  <polygon points="24,28 32,40 16,40" fill="#38bdf8" opacity="0.6"/>
</svg>